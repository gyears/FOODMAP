const map = L.map('map', {scrollWheelZoom:true, zoomControl:true}).setView([23.7, 121.0], 8);
let tileErrorCount = 0;
let fallenBack = false;
const primaryTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, FAO, NOAA, USGS'
}).addTo(map);
primaryTiles.on('tileerror', () => {
  tileErrorCount++;
  // if a real chunk of tiles fail to load shortly after startup, the tile
  // host is likely blocking/rate-limiting us — switch to a different free
  // no-key tile source automatically instead of leaving a blank map.
  if(!fallenBack && tileErrorCount > 6){
    fallenBack = true;
    map.removeLayer(primaryTiles);
    L.tileLayer('https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, style by Wikimedia'
    }).addTo(map);
  }
});

function tierColor(cat){ return cat === '500碗' ? '#c8552d' : '#2c3e63'; }

let bowlCluster = L.markerClusterGroup({
  iconCreateFunction: c => clusterIcon(c, 'bowl'),
  maxClusterRadius: 50
});
let dishCluster = L.markerClusterGroup({
  iconCreateFunction: c => clusterIcon(c, 'dish'),
  maxClusterRadius: 50
});

function clusterIcon(cluster, kind){
  const count = cluster.getChildCount();
  const size = count < 10 ? 32 : count < 30 ? 40 : 50;
  return L.divIcon({
    html: `<div class="mc-inner marker-cluster-${kind}" style="font-size:${size>44?14:12}px;">${count}</div>`,
    className: '', iconSize: L.point(size, size)
  });
}

const allMarkers = RECORDS.map((r, idx) => {
  const color = tierColor(r.cat);
  const m = L.circleMarker([r.lat, r.lng], {
    radius: 6, weight: 1.5, color: '#fff', fillColor: color, fillOpacity: 0.92
  });
  const catClass = r.cat === '500碗' ? 'bowl' : 'dish';
  const gmapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.lat + ',' + r.lng);
  m.bindPopup(
    `<span class="pop-tier ${catClass}">${r.cat}｜${r.tier}</span>
     <div class="pop-name">${r.name}</div>
     <div class="pop-addr">${r.addr}</div>
     ${r.dishes ? `<div class="pop-addr" style="margin-top:4px;">${r.dishes}</div>` : ''}
     <a href="${gmapsUrl}" target="_blank" rel="noopener" style="font-size:12px;">在 Google 地圖開啟 →</a>`
  );
  m.on('click', () => selectRecord(idx));
  m._rec = r;
  return m;
});

let currentCat = 'all';
function rebuildClusters(){
  bowlCluster.clearLayers(); dishCluster.clearLayers();
  map.removeLayer(bowlCluster); map.removeLayer(dishCluster);
  allMarkers.forEach(m => {
    if(currentCat !== 'all' && m._rec.cat !== currentCat) return;
    if(m._rec.cat === '500碗') bowlCluster.addLayer(m); else dishCluster.addLayer(m);
  });
  if(currentCat === 'all' || currentCat === '500碗') map.addLayer(bowlCluster);
  if(currentCat === 'all' || currentCat === '500盤') map.addLayer(dishCluster);
  const n = RECORDS.filter(r => currentCat==='all' || r.cat===currentCat).length;
  document.getElementById('countPill').textContent = `共 ${n} 間`;
}
rebuildClusters();

document.getElementById('catSeg').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#catSeg button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  rebuildClusters();
});

const citySelect = document.getElementById('citySelect');
CITY_ORDER.forEach(c => {
  const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
  citySelect.appendChild(opt);
});
citySelect.addEventListener('change', () => {
  const c = citySelect.value;
  if(c === 'all'){ map.setView([23.7, 121.0], 8); return; }
  const pts = RECORDS.filter(r => r.city === c);
  if(!pts.length) return;
  const bounds = L.latLngBounds(pts.map(r => [r.lat, r.lng]));
  map.fitBounds(bounds, {padding:[36,36], maxZoom: 15});
});

function selectRecord(idx){
  const r = RECORDS[idx];
  const catClass = r.cat === '500碗' ? 'bowl' : 'dish';
  const gmapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.lat + ',' + r.lng);
  document.getElementById('panel').innerHTML = `
    <h3>${r.name}</h3>
    <span class="p-tier ${catClass}">${r.cat}｜${r.tier}</span>
    <div class="p-row"><b>地址</b>${r.addr}</div>
    ${r.dishes ? `<div class="p-row"><b>得獎菜色</b>${r.dishes}</div>` : ''}
    <div class="p-row"><b>縣市 / 行政區</b>${r.city}${r.dist ? ' '+r.dist : ''}</div>
    <a class="p-link" href="${gmapsUrl}" target="_blank" rel="noopener">在 Google 地圖開啟 →</a>
  `;
  map.setView([r.lat, r.lng], 17, {animate:true});
}

const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  const panel = document.getElementById('panel');
  if(!q){
    panel.innerHTML = `<div class="panel-empty">拖曳地圖平移、滾輪縮放，或用上方搜尋框找店名。<br><br>點選地圖上任一圓點查看店家詳細資訊（地址／得獎菜色）。</div>`;
    return;
  }
  const matches = RECORDS.map((r,i)=>({r,i})).filter(({r}) => (currentCat==='all'||r.cat===currentCat) && r.name.includes(q)).slice(0,40);
  if(!matches.length){
    panel.innerHTML = `<div class="panel-empty">找不到符合「${q}」的店家。</div>`;
    return;
  }
  panel.innerHTML = matches.map(({r,i}) =>
    `<div class="result-item" data-idx="${i}"><div class="rn">${r.name}</div><div class="rc">${r.city}${r.dist?(' '+r.dist):''} ・ ${r.cat}｜${r.tier}</div></div>`
  ).join('');
  panel.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => selectRecord(parseInt(el.dataset.idx)));
  });
});
</script>
</body>
</html>
